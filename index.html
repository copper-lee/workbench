  /* ---------- 条目事件绑定 ---------- */
  function bindItemEvents(root){
    root.querySelectorAll("[data-done]").forEach(el=>el.onclick=()=>setTaskDone(el.getAttribute("data-done")));
    root.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>{ editing[el.getAttribute("data-edit")]=true; renderAll(); });
    root.querySelectorAll("[data-cancel]").forEach(el=>el.onclick=()=>{ delete editing[el.getAttribute("data-cancel")]; renderAll(); });
    root.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{
      const [type,id]=el.getAttribute("data-del").split(":");
      if(confirm("确定删除这条记录？")){ state[type]=state[type].filter(x=>x.id!==id); markTomb(id); delete editing[id]; save(); renderAll(); toast("已删除"); }
    });
    root.querySelectorAll("[data-save]").forEach(el=>el.onclick=()=>{
      const [type,id]=el.getAttribute("data-save").split(":");
      const item=state[type].find(x=>x.id===id); if(!item) return;
      if(type==="tasks"){
        item.title=document.getElementById("e-title").value.trim()||item.title;
        const fl=document.getElementById("e-flash")?document.getElementById("e-flash").checked:!!item.flash;
        item.flash=fl;
        if(fl){
          item.due=""; item.start=""; item.remind=false; item.note="";
        }else{
          item.due=document.getElementById("e-due").value;
          item.remind=document.getElementById("e-remind").checked;
          item.start=item.remind ? "" : (document.getElementById("e-start").value || item.start || item.created || todayStr());
          item.note=document.getElementById("e-note").value.trim();
        }
        item.tags=document.getElementById("e-tags").value.trim();
      }else if(type==="projects"){
        item.title=document.getElementById("e-title").value.trim()||item.title;
        const ed=document.getElementById("e-date"); if(ed) item.date=ed.value;
        item.note=document.getElementById("e-note").value.trim();
      }else if(type==="meetings"){
        item.date=document.getElementById("e-date").value;
        item.time=document.getElementById("e-time").value;
        item.location=document.getElementById("e-loc").value;
        item.title=document.getElementById("e-title").value.trim()||item.title;
        item.note=document.getElementById("e-note").value.trim();
        if(item.notified && (item.notified.m30!==undefined || item.notified.m10!==undefined || item.notified.d1===undefined || item.notified.h1===undefined)) item.notified={d1:false,h1:false,m10:false};
      }else if(type==="memos"){
        item.title=document.getElementById("e-title").value.trim()||item.title;
        if(memoGroup(item)==="erp"){
          const ea=document.getElementById("e-account"), ep=document.getElementById("e-password"), en=document.getElementById("e-note");
          if(ea) item.account=ea.value.trim();
          if(ep) item.password=ep.value;
          if(en) item.note=en.value.trim();
        }else{
          const ec=document.getElementById("e-content"); if(ec) item.content=ec.value;
        }
        item.updated=todayStr();
      }else if(type==="ideas"){
        item.content=document.getElementById("e-content").value.trim()||item.content;
        item.tag=document.getElementById("e-tag").value.trim();
      }
      delete editing[id]; save(); renderAll(); toast("已保存");
    });
    root.querySelectorAll("[data-wxpush]").forEach(el=>el.onclick=()=>pushToWeChat(el.getAttribute("data-wxpush")));
    root.querySelectorAll("[data-mpush]").forEach(el=>el.onclick=()=>{ const m=state.meetings.find(x=>x.id===el.getAttribute("data-mpush")); if(m) pushMeeting(m); });
  }

  /* ---------- 推送（企业微信 / 飞书 / 钉钉 / Server酱 自适应） ---------- */
  function channelName(ch){ return ch==="feishu"?"飞书":(ch==="dingtalk"?"钉钉":(ch==="serverchan"?"微信(Server酱)":"企业微信")); }
  async function sendIM(text, label, title){
    const url=state.settings.wxWebhook;
    const ch=state.settings.wxChannel||"wx";
    if(!url){ toast("请先在设置中填写提醒渠道的地址 / SendKey"); setView("settings"); return; }
    /* Server酱：把消息推到个人微信「服务通知」 */
    if(ch==="serverchan"){
      const key=url.trim();
      const api="https://sctapi.ftqq.com/"+key+".send";
      const t=title||(text.split("\n")[0]||"工作台提醒");
      try{
        const res=await fetch(api,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"title="+encodeURIComponent(t)+"&desp="+encodeURIComponent(text)});
        const j=await res.json().catch(()=>({}));
        if(j.code===0) toast((label||"已推送")+"（微信·Server酱）");
        else toast("推送失败："+(j.message||("HTTP "+res.status)));
      }catch(e){ toast("推送失败，可能为跨域限制，建议部署后使用"); }
      return;
    }
    const body = ch==="feishu" ? {msg_type:"text", content:{text:text}} : {msgtype:"text", text:{content:text}};
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await res.json().catch(()=>({}));
      const ok = ch==="feishu" ? (j.code===0 || (res.ok && j.code===undefined)) : (res.ok && (j.errcode===0 || j.errcode===undefined));
      if(ok) toast((label||"已推送")+"（"+channelName(ch)+"）");
      else toast("推送失败："+(j.errmsg||j.msg||("HTTP "+res.status)));
    }catch(e){ toast("推送失败，可能为跨域限制，建议部署后使用"); }
  }

  /* ---------- 待办一键推送 ---------- */
  async function pushToWeChat(taskId){
    const t=state.tasks.find(x=>x.id===taskId); if(!t) return;
    const text=`【工作台待办提醒】\n事项：${t.title}\n${t.due?('到期：'+t.due+'\n'):''}${t.note?('备注：'+t.note):''}`;
    sendIM(text,"已推送待办","【工作台待办提醒】"+t.title);
  }

  /* ---------- 会议提醒调度（会议前一天/1小时/10分钟推送） ---------- */
  function meetingTimestamp(m){
    if(!m.date||!m.time) return NaN;
    const t=new Date(m.date+"T"+m.time).getTime();
    return isNaN(t)?NaN:t;
  }
  function pushMeeting(m){
    const text="【会议提醒】\n会议："+m.title+"\n时间："+m.date+" "+(m.time||"")+"\n地点："+(m.location||"—")+(m.note?("\n备注："+m.note):"");
    return sendIM(text,"已推送会议提醒","【会议提醒】"+m.title);
  }
  /* 推送去重哨兵：存在 localStorage（同浏览器的所有标签页共享）。
     以前只写在页面内存里，同浏览器开 N 个标签页就会各推一次（用户遇到过连推 5 次） */
  const NOTIF_KEY="wb_notif_sent_v1";
  const NOTIF_LOG="wb_notif_log_v1";
  function notifSentinel(){ try{ return JSON.parse(localStorage.getItem(NOTIF_KEY)||"{}"); }catch(e){ return {}; } }
  /* 同一场会议可能因为同步产生「id 不同但内容相同」的两条记录，
     所以同时用 id 与内容（日期|时间|标题）两个键去重，任一键命中即视为已推送 */
  function notifKeys(m){
    const ks=[];
    if(m.id) ks.push("id:"+m.id);
    ks.push("c:"+(m.date||"")+"|"+(m.time||"")+"|"+(m.title||""));
    return ks;
  }
  function notifWasSent(m,key){ const s=notifSentinel(); return notifKeys(m).some(k=>!!s[k+"|"+key]); }
  function markNotifSent(m,key){
    try{
      const s=notifSentinel(); const now=Date.now();
      notifKeys(m).forEach(k=>{ s[k+"|"+key]=now; });
      const ks=Object.keys(s);
      if(ks.length>400){ ks.sort((a,b)=>s[a]-s[b]).slice(0,ks.length-300).forEach(k=>delete s[k]); }  // 只留最近 400 条
      localStorage.setItem(NOTIF_KEY,JSON.stringify(s));
      notifLog((m.title||"会议")+" · "+notifyLabel(key), (m.date||"")+" "+(m.time||""));
    }catch(e){}
  }
  function notifyLabel(k){ return k==="d1"?"会前一天":(k==="h1"?"会前1小时":"会前10分钟"); }
  function notifLog(name, when){
    try{
      let log=[]; try{ log=JSON.parse(localStorage.getItem(NOTIF_LOG)||"[]"); }catch(e){ log=[]; }
      if(!Array.isArray(log)) log=[];
      log.unshift({t:Date.now(), name:name, when:when});
      if(log.length>30) log=log.slice(0,30);
      localStorage.setItem(NOTIF_LOG,JSON.stringify(log));
    }catch(e){}
  }
  let _notifInflight={};    // 同一场会议同一档位「正在推送」，杜绝并发重发
  let _notifRecent=[];      // 全局限流：10 分钟内最多 5 条，防止代码异常时刷屏
  function notifThrottled(){
    const now=Date.now();
    _notifRecent=_notifRecent.filter(t=>now-t<600000);
    return _notifRecent.length>=5;
  }
  function checkReminders(){
    if(!state.settings.wxWebhook) return;
    const now=Date.now();
    state.meetings.forEach(m=>{
      if(!m.notified) m.notified={d1:false,h1:false,m10:false};
      /* 只把「真正的旧结构」迁移过来。注意 m10 属于新结构，
         以前写成 `m30!==undefined || m10!==undefined` → 每次检查都命中 → 标记被清空 → 每 20 秒重复推送 */
      if(m.notified.d1===undefined && (m.notified.m30!==undefined || m.notified.m10!==undefined)){
        m.notified={d1:false,h1:false,m10:false};
      }
      const mt=meetingTimestamp(m);
      if(isNaN(mt)) return;
      [[1440,"d1"],[60,"h1"],[10,"m10"]].forEach(function(p){
        const off=p[0], key=p[1];
        const target=mt-off*60000;
        if(m.notified[key] || notifWasSent(m,key)){ m.notified[key]=true; return; }
        const guard=(m.id||m.title)+"|"+key;
        if(_notifInflight[guard]) return;
        if(now>=target && now<=mt+60000){
          // 先打标记再推送：本浏览器其他标签页立刻可见，绝不重推
          m.notified[key]=true; markNotifSent(m,key);
          if(now-target > 30*60000){ save(); return; }   // 提醒时点已过超过 30 分钟（如当天下午才建明天的会），不再补推「前一天」
          _notifInflight[guard]=true;
          save();
          if(notifThrottled()){ delete _notifInflight[guard]; console.warn("[notif] 10 分钟内已推 5 条，触发限流，本次跳过"); return; }
          _notifRecent.push(Date.now());
          const pr=pushMeeting(m);
          if(pr && typeof pr.finally==="function") pr.finally(()=>{ delete _notifInflight[guard]; });
          else setTimeout(()=>{ delete _notifInflight[guard]; }, 15000);
        }
      });
    });
  }
  /* 提醒诊断：一眼看清「为什么推 / 推了几次 / 下次什么时候推」 */

  /* ---------- 云端同步（GitHub Gist，仅自己跨设备） ---------- */

  /* ---------- 同步自检：本机 vs 云端，定位数据卡在哪一端 ---------- */
  const ARR_NAME={tasks:"工作",meetings:"会议",memos:"备忘",ideas:"灵感",projects:"项目",routines:"例行"};
  async function runSyncDiag(){

      Object.keys(ARR_NAME).forEach(k=>{

      });

      if(miss.length) L.push("云端有但本机没有的会议："+miss.slice(0,5).map(m=>(m.date||"")+" "+(m.title||"")).join("；"));

  /* ---------- 自动同步 ----------
     触发时机：① 任何 save()（新增/修改/删除）后 1.5 秒；② 每 60 秒定时拉取其他设备的改动；
     ③ 切回本页面 / 网络恢复时补一次。
     保护：正在输入框里打字时不拉取，避免远端数据回来重绘打断输入（状态显示「待空闲同步」，下一次自动补上）。 */
  let _autoBusy=false, _lastSyncAt=0;
  function autoEnabled(){ return isSyncOn() && state.settings.sync.auto!==false; }
  function userTyping(){
    const a=document.activeElement; if(!a) return false;
    const tag=(a.tagName||"").toUpperCase();
    return tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT" || a.isContentEditable===true;
  }
  // 用户正在输入，或有条目处于内联编辑态 —— 此时不合入远端数据，否则重绘会冲掉正在填的内容
  function userBusy(){
    if(userTyping()) return true;
    try{ if(typeof editing!=="undefined" && Object.keys(editing).length>0) return true; }catch(e){}
    try{ if(typeof rtEditId!=="undefined" && rtEditId) return true; }catch(e){}
    return false;
  }
  let _autoRetryTimer=null, _pendingAuto=false;
  /* 忙（正在输入 / 上次同步未完）时不能把这次同步丢掉，否则「手机上加完就切走」的数据永远传不上去 */
  function scheduleAutoRetry(delay){
    clearTimeout(_autoRetryTimer);
    _autoRetryTimer=setTimeout(()=>{
      if(autoEnabled() && document.visibilityState!=="hidden") autoSync();
      else if(autoEnabled()) flushPendingPush();     // 后台时至少把本端改动推出去
    }, delay||5000);
  }
  async function autoSync(){
    if(!autoEnabled() || _suppressPush) return;
    if(_autoBusy){ _pendingAuto=true; return; }                       // 同步中：标记待办，结束后补跑
    if(userBusy()){ setSyncStatus("待空闲同步","sb-busy"); scheduleAutoRetry(5000); return; }
    _autoBusy=true;
    try{
      await pullSync();
      await pushSync();
      _lastSyncAt=Date.now();
    }catch(e){
      console.warn("[auto sync]", e);
      setSyncStatus("自动同步失败","sb-err");
      scheduleAutoRetry(15000);
    }finally{
      _autoBusy=false;
      if(_pendingAuto){ _pendingAuto=false; setTimeout(autoSync, 800); }
    }
  }
  async function pushSync(opts){
    if(!isSyncOn() || _suppressPush) return;
    const s=state.settings.sync;
    if(s.token.startsWith("github_pat_")) throw new Error("请使用 Classic Token（Fine-grained 令牌不支持 Gist）");
    const body=JSON.stringify({description:"个人工作台云端同步",public:false,files:{"workbench.json":{content:syncPayload()}}});
    // keepalive：页面被切走/关闭时也能把请求发完（移动端很容易「加完就退出」）
    const res=await fetch("https://api.github.com/gists/"+encodeURIComponent(s.gistId),{method:"PATCH",headers:gistHeaders(),body,keepalive: !!(opts&&opts.keepalive)});
    if(!res.ok){ const j=await res.json().catch(()=>({})); let msg=j.message||("HTTP "+res.status); if(res.status===404 || msg==="Not Found") msg="Token 无效、无 gist 权限，或使用了 Fine-grained 令牌（需 Classic Token + gist 权限）。可点上方「检查 Token」诊断，或在「配置帮助」查看图文步骤。"; throw new Error(msg); }
    setSyncStatus("已同步 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));
  }
  /* 待推送的改动立刻发出（不等 1.5s 防抖）：切后台 / 关页面前调用 */
  function flushPendingPush(){
    if(_pushTimer){ clearTimeout(_pushTimer); _pushTimer=null; }
    if(!isSyncOn() || _suppressPush) return;
    try{ pushSync({keepalive:true}); }catch(e){ console.warn("[flush push]", e); }
  }
  /* 删除墓碑：记录「某 id 已被删除 + 删除时间」。同步是按 id 并集合并（只增不删），
     若无墓碑，一端删除后会被另一端推到云端的旧副本"复活"（重复例行任务反复出现的根源）。
     规则：合并时条目的 updatedAt 晚于墓碑时间 -> 视为删除后又编辑，允许复活；否则丢弃。 */
  function tombMap(){
    state.meta=state.meta||{};
    if(!state.meta.tombstones || typeof state.meta.tombstones!=="object") state.meta.tombstones={};
    return state.meta.tombstones;
  }
  function markTomb(id){ if(id===undefined||id===null||id==="") return; tombMap()[String(id)]=Date.now(); }
  // 按 id 逐条合并：并集；同 id 取 updatedAt 较大（较新）的一方。用于双向同步，避免整包覆盖导致单边数据丢失。
  function mergeArray(local, remote, tomb){
    const alive=(x)=>{
      if(!x || x.id===undefined || x.id===null) return false;
      const ts = tomb && tomb[String(x.id)];
      return !(ts!==undefined && ts >= (x.updatedAt||0));
    };
    const map={};
    (local||[]).forEach(x=>{ if(alive(x)) map[x.id]=x; });
    (remote||[]).forEach(x=>{
      if(!alive(x)) return;
      const l=map[x.id];
      if(!l){ map[x.id]=x; }
      else {
        const lu=(l.updatedAt||0), ru=(x.updatedAt||0);
        if(ru>lu) map[x.id]=x;   // 远端更新 -> 取远端
      }
    });
    return Object.values(map);
  }
  async function pullSync(){
    if(!isSyncOn()) return;
    const s=state.settings.sync;
    if(s.token.startsWith("github_pat_")) throw new Error("请使用 Classic Token（Fine-grained 令牌不支持 Gist）");
    const res=await fetch("https://api.github.com/gists/"+encodeURIComponent(s.gistId),{headers:gistHeaders()});
    if(!res.ok){ const j=await res.json().catch(()=>({})); let msg=j.message||("HTTP "+res.status); if(res.status===404 || msg==="Not Found") msg="Token 无效、无 gist 权限，或使用了 Fine-grained 令牌（需 Classic Token + gist 权限）。可点上方「检查 Token」诊断，或在「配置帮助」查看图文步骤。"; throw new Error(msg); }
    const data=await res.json();
    const f=data.files && data.files["workbench.json"];
    if(!f || !f.content) return;
    let remote; try{ remote=JSON.parse(f.content); }catch(e){ return; }
    const localSync=state.settings.sync;
    const ARRAYS=['tasks','meetings','memos','ideas','projects','routines','misc'];
    // 合并双方墓碑（取较大时间戳），并传给合并器：已删除且无后续编辑的条目不再复活
    const lt=tombMap();
    const rt=(remote.meta && remote.meta.tombstones && typeof remote.meta.tombstones==="object") ? remote.meta.tombstones : {};
    Object.keys(rt).forEach(k=>{ if(!lt[k] || rt[k]>lt[k]) lt[k]=rt[k]; });
    let changed=false;
    ARRAYS.forEach(k=>{
      const lArr=state[k]||[];
      const merged=mergeArray(lArr, remote[k]||[], lt);
      if(merged.length!==lArr.length || merged.some((m,i)=> m!==lArr[i])){ state[k]=merged; changed=true; }
    });
    /* 会议「已推送」标记跨设备取「或」：任一端推过，另一端就不再推。
       否则同步拉回的旧副本会把标记冲成 false → 下一次检查又推一遍（每同步一次推一次） */
    const rMeet={}; (remote.meetings||[]).forEach(x=>{ if(x&&x.id) rMeet[x.id]=x; });
    (state.meetings||[]).forEach(m=>{
      const r=rMeet[m.id]; if(!r || !r.notified) return;
      m.notified=m.notified||{};
      ["d1","h1","m10"].forEach(k=>{ if(r.notified[k]) m.notified[k]=true; });
    });
    if(!state.settings) state.settings={wxWebhook:"",wxChannel:"wx"};
    state.settings.sync=Object.assign({}, state.settings.sync, localSync);
    if(remote.settings && remote.settings.wxWebhook!==undefined && !state.settings.wxWebhook) state.settings.wxWebhook=remote.settings.wxWebhook;
    state.meta = state.meta || {updatedAt:Date.now()};
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    _snap = JSON.stringify(state);
    if(changed) renderAll();
  }
  async function createGist(){
    const s=state.settings.sync;

    setSyncStatus("创建中…","sb-busy");

        if(res.status===404 || msg==="Not Found") msg="Token 无效、无 gist 权限，或使用了 Fine-grained 令牌（需 Classic Token + gist 权限）。可点上方「检查 Token」诊断，或在「配置帮助」查看图文步骤。";

  async function verifyToken(){
    const tokenInput=document.getElementById("set-sync-token");
    const status=document.getElementById("tokenStatus");
    const token=tokenInput ? tokenInput.value.trim() : (state.settings.sync.token||"");
    if(!token){ if(status) status.innerHTML='<span class="token-status err">请先填写 Token</span>'; return; }
    if(status) status.innerHTML='<span class="token-status warn">检查中…</span>';
    try{
      if(token.startsWith("github_pat_")) throw new Error("这是 Fine-grained 令牌，Gist 不支持。请改用 Classic Token（以 ghp_ 开头）。");
      const res=await fetch("https://api.github.com/user",{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token}});
      const scopes=(res.headers.get("X-OAuth-Scopes")||"").split(",").map(s=>s.trim());
      if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.message||("HTTP "+res.status)); }
      if(!scopes.includes("gist")) throw new Error("Token 有效，但缺少 gist 权限，请重新生成并勾选 gist 后再试。");
      if(status) status.innerHTML='<span class="token-status ok">Token 有效，且已具备 gist 权限 ✓</span>';
    }catch(e){ if(status) status.innerHTML='<span class="token-status err">'+esc(e.message)+'</span>'; }
  }

  /* ---------- 代码自检更新（跨设备同步"工作台本身"） ---------- */
  function cmpVer(a,b){
    const pa=String(a).split(".").map(n=>parseInt(n,10)||0);
    const pb=String(b).split(".").map(n=>parseInt(n,10)||0);
    const n=Math.max(pa.length,pb.length);
    for(let i=0;i<n;i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x>y?1:-1; }
    return 0;
  }
  function verFromSource(src){
    const m=src && src.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    return m?m[1]:"";
  }
  // 取当前 HTML 源码：http(s) 下直接 fetch 自身；file:// 或 fetch 失败时，序列化当前运行页 DOM（无需再选文件）；极个别异常才退回文件选择器
  async function getSourceHTML(){
    if(location.protocol!=="file:"){
      try{
        const r=await fetch(location.href,{cache:"no-store"});
        if(r.ok){ const t=await r.text(); if(t && t.length>2000 && t.indexOf("个人工作台")>-1) return t; }
      }catch(e){}
    }
    // file:// 直接读运行中的 DOM，数据在 localStorage 不嵌在 HTML 里，序列化出的源码完整可用
    try{
      const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
      if(html.length>3000 && html.indexOf("个人工作台")>-1) return html;
    }catch(e){}
    // 极端兜底：让用户手动选择源码文件
    return await new Promise((resolve)=>{
      const inp=document.getElementById("codeFileInput"); if(!inp){ resolve(null); return; }
      inp.onchange=(e)=>{ inp.onchange=null; const f=e.target.files&&e.target.files[0]; if(!f){ resolve(null); return; } const rd=new FileReader(); rd.onload=()=>resolve(rd.result); rd.onerror=()=>resolve(null); rd.readAsText(f); };
      inp.value=""; inp.click();
    });
  }
  async function publishVersion(){
    if(!isSyncOn()){ toast("请先在设置中开启并配置云端同步"); setView("settings"); return; }
    setSyncStatus("发布中…","sb-busy");
    try{
      const src=await getSourceHTML();
      if(!src){ setSyncStatus("发布取消","sb-err"); toast("未获取到源码，已取消发布"); return; }
      const s=state.settings.sync;
      const body=JSON.stringify({description:"个人工作台云端同步",public:false,files:{
        "workbench.json":{content:syncPayload()},
        "workbench.code.html":{content:src}
      }});
      const res=await fetch("https://api.github.com/gists/"+encodeURIComponent(s.gistId),{method:"PATCH",headers:gistHeaders(),body});
      if(!res.ok){ const j=await res.json().catch(()=>({})); let msg=j.message||("HTTP "+res.status); throw new Error(msg); }
      setSyncStatus("已同步 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));
      toast("已发布新版本 v"+APP_VERSION+" 到云端");
    }catch(e){ setSyncStatus("发布失败","sb-err"); toast("发布失败："+e.message); }
  }
  let _remoteCodeHTML="";
  async function checkUpdate(){
    if(!isSyncOn()) return false;
    const s=state.settings.sync;
    if(s.token.startsWith("github_pat_")) return false;
    try{
      const res=await fetch("https://api.github.com/gists/"+encodeURIComponent(s.gistId),{headers:gistHeaders()});
      if(!res.ok) return false;
      const data=await res.json();
      const f=data.files && data.files["workbench.code.html"];
      if(!f || !f.content) return false;
      const rv=verFromSource(f.content); if(!rv) return false;
      _remoteCodeHTML=f.content;
      if(cmpVer(rv, APP_VERSION)>0){
        const banner=document.getElementById("updateBanner");
        const ubv=document.getElementById("ubVer"), ubc=document.getElementById("ubCur");
        if(banner) banner.style.display="flex";
        if(ubv) ubv.textContent="v"+rv;
        if(ubc) ubc.textContent="v"+APP_VERSION;
        return true;
      }
    }catch(e){}
    return false;
  }
  function downloadUpdate(){
    if(!_remoteCodeHTML) return;
    const blob=new Blob([_remoteCodeHTML],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="个人工作台.html"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast("新版本已开始下载。请用它替换你原来的 个人工作台.html（同一位置），设置与数据都不会丢");
  }

  /* ---------- 全局事件 ---------- */
  document.querySelectorAll(".nav-item,.mobile-tab button").forEach(b=>{
    if(b.hasAttribute("data-more")){ b.onclick=openMore; return; }
    b.onclick=()=>setView(b.getAttribute("data-view"));
  });
  buildMoreSheet();
  document.getElementById("btnSync").onclick=syncNow;
  document.getElementById("btnExport").onclick=exportJSON;
  document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("btnClearSample").onclick=()=>{
    if(!confirm("清空示例数据？你自己的数据会保留。")) return;
    ["tasks","meetings","memos","ideas","projects","routines"].forEach(k=>{ state[k].forEach(x=>{ if(x.sample) markTomb(x.id); }); state[k]=state[k].filter(x=>!x.sample); });
    localStorage.removeItem(SEED_FLAG); save(); renderAll(); toast("示例数据已清空");
  };
  document.getElementById("fileInput").onchange=(e)=>{
    const f=e.target.files[0]; if(f) importJSON(f); e.target.value="";
  };

  /* ---------- 启动 ---------- */
  renderAll();
  if(location.protocol==="file:") toast("当前 file:// 打开：Chrome/Edge 可直接点「立即同步」尝试；若失败请改用 http://localhost:8080/个人工作台.html");
  setView("overview");
  // 启动自愈：先合并重复规则（跨设备同步/重复创建会产生同名同参数的两条规则），再清理重复任务，最后补生成
  const _m = mergeDuplicateRoutines();
  dedupeRoutineTasks();
  generateRoutines(todayStr(), true);
  if(_m>0) toast("已自动合并 "+_m+" 条重复的例行工作规则");
  if(isSyncOn()){
    setSyncStatus("同步中…","sb-busy");
    _autoBusy=true;   // 占用同步锁，避免与启动后触发的自动同步并发打架
    pullSync().then(()=>{
      setSyncStatus("已同步");
      // 远端合并进来的数据也可能带重复规则，收敛一次
      const mm=mergeDuplicateRoutines();
      const dd=dedupeRoutineTasks();
      generateRoutines(todayStr(), true);
      if(mm>0 || dd>0) renderAll();
      if(mm>0) toast("已自动合并 "+mm+" 条重复的例行工作规则");
    }).catch(()=>setSyncStatus("同步失败","sb-err")).finally(()=>{ _autoBusy=false; });
    checkUpdate().then(has=>{ if(has) toast("发现新版本，可在设置 → 云端同步下载"); });
  }
  checkReminders();
  setInterval(checkReminders, 20000);
  // 自动同步：每 60 秒拉一次其他设备的改动（页面在后台时不打扰）；切回页面、网络恢复时立即补一次
  setInterval(()=>{ if(autoEnabled() && document.visibilityState==="visible") autoSync(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible"){ if(Date.now()-_lastSyncAt>15000) autoSync(); }
    else flushPendingPush();          // 切走（手机按 Home / 切 App）时立刻把改动推上去
  });
  window.addEventListener("pagehide", flushPendingPush);
  window.addEventListener("online", ()=>autoSync());
})();
</script>
</body>
