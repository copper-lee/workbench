<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 移动端：添加到主屏幕后全屏运行、隐藏浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M7 12h10M7 8h10M7 16h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M7 12h10M7 8h10M7 16h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- 本工作台为单文件 HTML（localStorage 本地存储方案），可直接作为模板分发给同事，每人数据独立 -->
<title>个人工作台 · 工作 / 会议 / 备忘 / 灵感</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --primary:#2563eb; --primary-soft:#eaf1ff;
    --text:#1f2937; --muted:#6b7280; --border:#e6e9ef; --danger:#dc2626;
    --success:#16a34a; --warn:#d97706; --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  }
  .app{display:flex;min-height:100vh;max-width:1200px;margin:0 auto}
  /* 侧边栏（PC） */
  .sidebar{
    width:200px;flex:0 0 200px;background:var(--card);border-right:1px solid var(--border);
    padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;padding:4px 8px 14px}
  .brand svg{width:24px;height:24px;color:var(--primary)}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;
    padding:11px 12px;border-radius:10px;color:var(--text);font-size:14.5px;cursor:pointer;font-family:inherit;
  }
  .nav-item svg{width:18px;height:18px;flex:0 0 18px;color:var(--muted)}
  .nav-item:hover{background:#f1f4f9}
  .nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav-item.active svg{color:var(--primary)}
  .sidebar .spacer{flex:1}
  /* 主区 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .topbar .title{font-size:17px;font-weight:700;margin-right:auto}
  .sync-badge{
    font-size:12px;color:var(--success);background:#eafaef;border:1px solid #c7efd4;
    padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  }
  .sync-badge svg{width:12px;height:12px}
  .sync-badge.sb-busy{color:var(--warn);background:#fff7ed;border-color:#fde3bf}
  .sync-badge.sb-err{color:var(--danger);background:#fde8e8;border-color:#f3c9c9}
  .btn{
    border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;
    padding:8px 12px;font-size:13.5px;cursor:pointer;font-family:inherit;min-height:40px;display:inline-flex;align-items:center;gap:6px;
  }
  .btn svg{width:15px;height:15px}
  .btn:hover{background:#f1f4f9}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn-danger{color:var(--danger);border-color:#f3c9c9}
  .today-empty{padding:14px;text-align:center;color:var(--muted);font-size:14px}
  /* 视图 */
  .view{padding:16px 18px 90px;display:none}
  .view.active{display:block}
  .view-head{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
  .view-head h2{font-size:18px;margin:0}
  .view-head .sub{color:var(--muted);font-size:13px}
  .sub-head{display:flex;align-items:baseline;gap:10px;margin:18px 2px 10px;font-size:16px;font-weight:700}
  .sub-head:first-of-type{margin-top:2px}
  .sub-head small{font-size:12px;font-weight:400;color:var(--muted)}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:12px;
  }
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;color:var(--muted)}
  input,select,textarea{
    font-family:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--border);border-radius:9px;
    background:#fff;color:var(--text);width:100%;
  }
  textarea{resize:vertical;min-height:64px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  /* 列表项 */
  .item{display:flex;flex-direction:column;gap:8px}
  .item-row{display:flex;align-items:flex-start;gap:10px}
  .ck{width:20px;height:20px;flex:0 0 20px;margin-top:2px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  /* 触控放大：视觉仍是 20px，但命中区扩展到 44px（移动端手指友好） */
  .ck::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
  .ck-line{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin:8px 0 2px;user-select:none;color:var(--text,#222)}
  .ck-line input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
  .ck.done{background:var(--success);border-color:var(--success)}
  .ck.done svg{width:13px;height:13px;color:#fff}
  .item-main{flex:1;min-width:0}
  .item-title{font-size:15px;font-weight:600;word-break:break-word}
  .item.done .item-title{text-decoration:line-through;color:var(--muted)}
  .item-sub{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word;white-space:pre-wrap}
  .erp-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .erp-val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
  .erp-pw{letter-spacing:2px}
  .erp-link{border:none;background:none;color:var(--primary);font-size:12px;font-family:inherit;cursor:pointer;padding:2px;min-height:24px}
  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;margin-right:6px}
  .p0{background:#fde8e8;color:var(--danger)}
  .p1{background:#fff2e0;color:var(--warn)}
  .p2{background:#eaf1ff;color:var(--primary)}
  .tag-usr{background:#eef2f7;color:#5b6b7f}
  .reg-time{display:inline-block;font-size:12px;color:var(--muted);margin-left:2px}
  .due-over{color:var(--danger);font-weight:600}
  .item-actions{display:flex;gap:8px;flex:0 0 auto}
  .icon-btn{
    border:1px solid var(--border);background:#fff;border-radius:7px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  }
  .icon-btn svg{width:14px;height:14px}
  .icon-btn:hover{background:#f1f4f9;color:var(--text)}
  .icon-btn.danger:hover{color:var(--danger);border-color:#f3c9c9}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}
  /* 编辑态内嵌表单 */
  .edit-box{display:flex;flex-direction:column;gap:10px;width:100%}
  .edit-actions{display:flex;gap:8px;justify-content:flex-end}
  /* 设置 */
  .setting-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .setting-row .hint{font-size:12.5px;color:var(--muted)}
  /* 设置项手风琴（一级标题 + 点进展开） */
  .acc{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden;margin-bottom:10px}
  .acc:last-child{margin-bottom:0}
  .acc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
  .acc-head:hover{background:var(--bg)}
  .acc-head .acc-t{font-size:15px;font-weight:600;color:var(--text)}
  .acc-head .acc-badge{font-size:12px;font-weight:600;color:var(--primary);background:#eef4ff;border:1px solid #d6e4ff;padding:1px 8px;border-radius:999px}
  .acc-head .acc-sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:2px}
  .acc-head .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s ease}
  .acc.open .chev{transform:rotate(90deg)}
  .file-warn{margin:8px 0 4px;padding:10px 12px;border:1px solid var(--warn);background:#fff7e0;border-radius:10px;font-size:12.5px;line-height:1.6;color:#7a5b00}
  .file-warn code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}
  /* 代码自检更新横幅 */
  .update-banner{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px;padding:11px 13px;border:1px solid #d6e4ff;background:#eef4ff;border-radius:10px}
  .update-banner .ub-t{font-size:13px;color:var(--text);line-height:1.5}
  .update-banner .ub-t b{color:var(--primary)}
  .acc-body{display:none}
  .acc.open .acc-body{display:block;animation:accIn .18s ease}
  @keyframes accIn{from{opacity:.3}to{opacity:1}}
  .acc-body-inner{padding:4px 16px 16px;border-top:1px solid var(--border)}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  /* 配置帮助与 Token 状态 */
  .help-toggle{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;cursor:pointer;background:transparent;border:none;padding:0;font-family:inherit}
  .help-box{display:none;flex-direction:column;gap:10px;margin-top:8px;padding:12px;background:#f8fafc;border:1px solid var(--border);border-radius:10px}
  .help-box.show{display:flex}
  .help-step{display:flex;gap:10px;align-items:flex-start}
  .help-step .num{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .help-step .body{flex:1;font-size:13px;color:var(--text);line-height:1.55}
  .help-step .body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:12px}
  .token-status{font-size:12.5px;padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;margin-top:4px}
  .token-status.ok{color:#166534;background:#dcfce7}
  .token-status.err{color:#991b1b;background:#fee2e2}
  .token-status.warn{color:#92400e;background:#fef3c7}
  /* 日历甘特图 */
  .gantt-wrap{overflow:hidden;margin:0 0 12px}
  .gantt-scroll{overflow-x:auto;position:relative;padding-bottom:6px}
  .gantt-grid{display:grid;grid-template-columns:repeat(var(--gd),var(--gc,48px));row-gap:6px;align-items:center;min-width:max-content}
  .gcell{height:44px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
  .gcell.gweekend{background:#f7f9fc}
  .gcell.gtoday{background:var(--primary-soft)}
  .gcell.gtoday .gd{color:var(--primary);font-weight:700}
  .gcell .gd{font-weight:700;font-size:13px;line-height:1.15}
  .gcell .gw{color:var(--muted);font-size:10px}
  .gbar{height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#000;font-size:12px;overflow:hidden;white-space:nowrap;box-shadow:var(--shadow);background:#fff;border:1.5px solid transparent}
  .gbar-t{overflow:hidden;text-overflow:ellipsis}
  .g-norm{border-color:var(--primary)}
  .g-soon{border-color:var(--warn)}
  .g-over{border-color:var(--danger);color:var(--danger)}
  .g-meet{background:#7c3aed}
  /* 今日待办横幅（贴在日历/代办/会议板块上方） */
  .daily-banner{background:linear-gradient(180deg,#eef4ff,#f7faff);border:1px solid #d6e4ff}
  .daily-banner .db-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .daily-banner .db-head .db-t{font-weight:700;font-size:15px;color:var(--primary)}
  .daily-banner .db-head .db-sub{font-size:12.5px;color:var(--muted)}
  .db-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #e3ecff}
  .db-item:first-of-type{border-top:none}
  .db-item .db-title{font-size:14.5px;font-weight:600;flex:1;min-width:0}
  .db-item .db-meta{font-size:12.5px;color:var(--muted)}
  .db-item.over .db-title{color:var(--danger)}
  /* 会议日历（月视图） */
  .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cal-nav .cal-m{font-size:16px;font-weight:700;margin-right:auto}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0;font-weight:600}
  .cal-cell{border:1px solid var(--border);border-radius:10px;min-height:84px;padding:5px;background:#fff;display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .cal-cell.out{background:#fafbfc;color:var(--muted)}
  .cal-cell.today{background:var(--primary-soft);border-color:#bcd0ff}
  .cal-cell .cd{font-size:13px;font-weight:700;align-self:flex-end}
  .cal-chip{font-size:11.5px;line-height:1.3;background:#f3e9ff;color:#6b21a8;border-radius:6px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .cal-chip .ct{font-weight:700;margin-right:3px}
  .cal-empty{color:var(--muted);font-size:12px;text-align:center;padding:6px 0}
  .cal-tooltip{display:none;position:absolute;z-index:1000;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55;color:var(--text);box-shadow:var(--shadow);max-width:240px;white-space:normal;pointer-events:none}
  .cal-tooltip div{word-break:break-word}
  /* 会议日历紧凑模式（在「日历」板块内，可缩小） */
  .cal-compact .cal-cell{min-height:58px;padding:4px}
  .cal-compact .cal-chip{font-size:10.5px;padding:1px 5px;max-width:100%}
  .cal-compact .cal-dow{font-size:11.5px}
  .cal-mode{display:inline-flex;gap:4px}
  /* 项目管理 */
  .proj-prog{font-size:13px;color:var(--muted);background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px}
  .proj-prog .pp-t{font-weight:600;color:var(--text);font-size:12px}
  .proj-prog .pp-list{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .proj-prog .pp-list li{font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:7px;padding:6px 8px}
  .proj-prog .pp-list li .ppt{color:var(--muted);font-size:11.5px;margin-right:6px}
  .prog-form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  /* AI 复盘 / 打印 */
  .rep-meta{font-size:13px;color:var(--muted);margin-bottom:10px}
  .rep-sec{margin:14px 0}
  .rep-sec h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .rep-sec h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .rep-list{margin:0;padding-left:18px}
  .rep-list li{margin:4px 0;font-size:14px}
  .rep-kpi{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
  .rep-kpi .kpi{background:var(--primary-soft);border:1px solid #d6e4ff;border-radius:12px;padding:10px 14px;min-width:96px}
  .rep-kpi .kpi .n{font-size:22px;font-weight:800;color:var(--primary)}
  .rep-kpi .kpi .l{font-size:12px;color:var(--muted)}
  .rep-narr{background:#f8fafc;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;line-height:1.6}
  .seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);font-family:inherit}
  .seg button.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  /* 工作总览 */
  .ov-welcome{background:linear-gradient(135deg,var(--primary-soft) 0%,#f0f7ff 100%);border:1px solid #d6e4ff;border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .ov-welcome .ov-date{font-size:13px;color:var(--muted);margin-bottom:4px}
  .ov-welcome .ov-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px}
  .ov-welcome .ov-sub{font-size:14px;color:var(--muted)}
  /* 未开启云同步时的引导条（点击直达设置） */
  .sync-guide{
    display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:12px;
    background:#fffbeb;border:1px solid #fde3bf;border-radius:var(--radius);padding:12px 14px;
  }
  .sync-guide:hover{border-color:#fcd34d}
  .sync-guide>svg{width:20px;height:20px;flex:0 0 20px;color:var(--warn)}
  .sync-guide .sg-body{flex:1;min-width:0}
  .sync-guide .sg-t{font-size:14px;font-weight:700;color:#92400e}
  .sync-guide .sg-s{font-size:12.5px;color:#a16207;line-height:1.5;margin-top:2px}
  .sync-guide .sg-btn{font-size:13px;font-weight:600;color:var(--primary);white-space:nowrap;flex:0 0 auto}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
  .ov-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .ov-card .ov-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;font-weight:700}
  .ov-card .ov-head svg{width:18px;height:18px;color:var(--primary)}
  .ov-card .ov-more{display:inline-flex;align-items:center;gap:4px;margin-top:8px;color:var(--primary);font-size:13px;cursor:pointer;background:transparent;border:none;padding:0;font-family:inherit}
  .ov-meet{display:flex;flex-direction:column;gap:8px}
  .ov-meet-item{display:flex;align-items:flex-start;gap:10px;font-size:14px}
  .ov-meet-item .ov-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:0 0 8px}
  .ov-meet-item .ov-today .ov-dot{background:var(--success)}
  /* 总览「今日待办」可直接勾选完成 */
  .ov-meet-item .ov-ck{margin-top:1px;flex:0 0 20px}
  .ov-meet-item .ov-ck:hover{border-color:var(--primary)}
  .ov-meet-item .ov-time{color:var(--muted);font-size:12px;white-space:nowrap}
  .ov-empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0}
  /* 例行工作 */
  .rt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .rt-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;background:#fff}
  .rt-head:hover{background:#f8fafc}
  .rt-head .rt-chev{width:18px;height:18px;color:var(--muted);transition:transform .2s ease;flex:0 0 18px}
  .rt-card.open .rt-head .rt-chev{transform:rotate(90deg)}
  .rt-head .rt-title{font-size:16px;font-weight:700;color:var(--text)}
  .rt-head .rt-badge{font-size:12px;font-weight:600;color:var(--primary);background:#eef4ff;border:1px solid #d6e4ff;padding:1px 8px;border-radius:999px}
  .rt-head .rt-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .rt-head .rt-actions button{min-height:34px;padding:7px 12px;font-size:13px}
  .rt-body{display:none}
  .rt-card.open .rt-body{display:block}
  .rt-body-inner{padding:14px 16px 16px}
  .rt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .rt-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:10px}
  .rt-item .rt-num{width:22px;height:22px;border-radius:50%;background:#e6e9ef;color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
  .rt-item .rt-icon{color:var(--primary);flex:0 0 18px}
  .rt-item .rt-icon svg{width:18px;height:18px}
  .rt-item .rt-main{flex:1;min-width:0}
  .rt-item .rt-t{font-size:14.5px;font-weight:600;color:var(--text);word-break:break-word}
  .rt-item .rt-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .rt-tags{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .rt-tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#eaf1ff;color:var(--primary);font-weight:600}
  .rt-status{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
  .rt-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#cbd5e1}
  .rt-status.on{color:#15803d}
  .rt-status.on::before{background:#22c55e}
  .rt-item .item-actions{display:flex;gap:6px}
  .rt-features{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .rt-feature{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text)}
  .rt-feature .rt-ficon{width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
  .rt-feature .rt-ficon svg{width:16px;height:16px}
  .rt-add{display:flex;justify-content:flex-end;margin-bottom:12px}
  .rt-form{display:flex;flex-direction:column;gap:10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
  /* 开关 */
  .switch{position:relative;display:inline-block;width:40px;height:22px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:999px;transition:.2s}
  .slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked + .slider{background:var(--primary)}
  input:checked + .slider:before{transform:translateX(18px)}
  /* toast */
  @media print{
    .sidebar,.topbar,.mobile-tab,.sync-badge{display:none !important}
    .app{display:block;max-width:none}
    .view{display:none !important}
    #view-summary.view{display:block !important}
    body{background:#fff}
    .main{padding:0}
    .no-print{display:none !important}
  }
  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1f2937;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}
  /* 移动端底部 Tab */
  .mobile-tab{display:none}
  /* 移动端「更多」抽屉：收纳侧边栏里手机上不常驻的板块（PC 端始终隐藏） */
  .more-mask,.more-sheet{display:none}
  @media (max-width:767px){
    .more-mask.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
    .more-sheet.open{
      display:block;position:fixed;left:0;right:0;bottom:0;z-index:41;
      background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(15,23,42,.18);
      padding:8px 12px calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;
    }
    .more-sheet .ms-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 10px;font-size:14px;font-weight:700;color:var(--text)}
    .more-sheet .ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .more-sheet .ms-item{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
      min-height:78px;padding:10px 4px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;
      font-size:12px;line-height:1.25;color:var(--text);font-family:inherit;cursor:pointer;
    }
    .more-sheet .ms-item svg{width:22px;height:22px;color:var(--muted)}
    .more-sheet .ms-item.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
    .more-sheet .ms-item.active svg{color:var(--primary)}
  }
  /* 横滑提示条：手机上甘特图/宽表格需要左右滑动查看 */
  .scroll-hint{display:none;font-size:11.5px;color:var(--muted);margin:-2px 0 8px;text-align:right}
  @media (max-width:767px){
    /* App 外壳布局：页面整体不滚动，只有 .main 内部滚动 —— 底部 Tab 因此真正钉死在屏幕底部，
       彻底解决 iOS Safari 上滑/收起键盘时 fixed 底栏被地址栏带着跑、错位的问题 */
    html,body{height:100vh;height:100dvh;overflow:hidden}
    body{display:flex;flex-direction:column}
    /* 关键：body 变 flex 后，.app 的 margin:0 auto 会导致收缩为内容宽度（甘特 ~700px），整页溢出且无法横滑。
       必须恢复铺满：去掉 auto 边距 + width:100% */
    .app{flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;width:100%;max-width:none;margin:0}
    .sidebar{display:none}
    .main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:10px}
    .topbar{padding:10px 12px;gap:8px}
    .topbar .title{font-size:15px}
    .view{padding:10px 10px 24px}
    .mobile-tab{
      display:flex;flex:0 0 auto;position:relative;z-index:30;
      background:var(--card);border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom);
      box-shadow:0 -2px 10px rgba(15,23,42,.06);
    }
    .mobile-tab button{
      flex:1;border:none;background:transparent;padding:7px 2px 6px;font-size:10.5px;color:var(--muted);
      display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;
      min-height:50px;justify-content:center;
    }
    .mobile-tab button svg{width:21px;height:21px}
    .mobile-tab button.active{color:var(--primary)}
    .btn{min-height:44px}
    .tb-handle{min-height:38px}
    /* 触控目标放大 */
    .icon-btn{width:38px;height:38px;flex:0 0 38px}
    .icon-btn svg{width:16px;height:16px}
    .item-actions{gap:10px}
    /* ERP 分区的「显示 / 复制」是手指点的，手机上放大到易点的尺寸 */
    .erp-link{font-size:13px;padding:6px 8px;min-height:32px;-webkit-tap-highlight-color:transparent}
    .seg button{padding:9px 16px}
    /* 备忘等条目操作按钮变多（完成/上移/下移/编辑/删除）：允许整体换行，避免把正文挤成一条 */
    .item-row{flex-wrap:wrap}
    .item-main{flex:1 1 140px;min-width:0}
    .item-actions{gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
    .btn-icon-only,.icon-btn{-webkit-tap-highlight-color:transparent}
    /* 表单：手机上强制单列，避免两列挤压 */
    .form-grid{grid-template-columns:1fr !important;gap:8px}
    .card{padding:12px;border-radius:12px}
    /* 甘特图：列宽收窄 + 显示横滑提示 */
    .gantt-grid{--gc:42px}
    .gcell{height:40px}
    .gcell .gd{font-size:12px}
    .gcell .gw{font-size:9px}
    .gbar{height:20px;font-size:11px;padding:0 6px}
    .scroll-hint{display:block}
    /* 月历：7 格压缩留白 */
    .cal-grid{gap:3px}
    .cal-dow{font-size:11px}
    /* 概览网格单列 */
    .ov-grid{grid-template-columns:1fr !important}
    /* KPI / 统计数字换行防溢出 */
    .kpi-num{font-size:22px}
    /* 顶部按钮组允许换行，避免溢出屏幕 */
    .cal-nav{flex-wrap:wrap;gap:6px}
    .toolbar{gap:8px !important}
    .toolbar input[type="search"],.toolbar input{flex:1 1 120px;min-width:0}
    /* 编辑态按钮铺满，方便拇指操作 */
    .edit-actions{display:flex;gap:8px}
    .edit-actions .btn{flex:1;justify-content:center}
    /* Token / Gist ID 输入框：16px 防止 iOS 聚焦时自动放大页面 */
    .code{font-size:16px;letter-spacing:.2px}
    /* 设置页横向排列的按钮组在手机上换行 */
    .acc-body-inner > div[style*="display:flex"]{flex-wrap:wrap}
    .acc-body-inner input{flex:1 1 100% !important;min-width:0}
    /* 去掉移动端 hover 残留 */
    .nav-item:hover,.btn:hover,.icon-btn:hover{background:transparent}
    /* 长文本安全换行 */
    .item-title,.item-sub,.db-title{overflow-wrap:anywhere}
    /* 例行工作卡片：头部按钮换行铺开；条目改为「标题行 + 标签/操作行」两行布局，
       否则 序号+图标+标题+周期+状态+开关+编辑+删除 全挤一行，标题被压成一个字一列 */
    .rt-head{flex-wrap:wrap;row-gap:10px;padding:12px}
    .rt-head .rt-title{font-size:15px}
    .rt-head .rt-actions{flex:1 1 100%;margin-left:28px;flex-wrap:wrap}
    .rt-head .rt-actions .btn{flex:1 1 auto;padding:7px 10px;font-size:12.5px;white-space:nowrap}
    .rt-item{flex-wrap:wrap;row-gap:8px;padding:12px}
    .rt-item .rt-main{flex:1 1 150px;min-width:0}
    .rt-item .rt-tags{margin-left:32px}
    .rt-item .item-actions{margin-left:auto}
    /* 开关单独提到标题行最右侧：拆开操作组，用 order 重排 —— 第一行 标题+开关，第二行 标签+编辑+删除 */
    .rt-item .item-actions{display:contents}
    .rt-item .switch{order:1;margin-left:auto}
    .rt-item .rt-tags{order:2}
    .rt-item .icon-btn[data-redit]{order:3;margin-left:auto}
    .rt-item .icon-btn.danger{order:4}
  }
  @media (max-width:380px){
    .gantt-grid{--gc:38px}
    .mobile-tab button{font-size:9.5px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- PC 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>个人工作台</span>
    </div>
    <button class="nav-item active" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>工作总览
    </button>
    <button class="nav-item" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h8M8 18h8"/></svg>日历
    </button>
    <button class="nav-item" data-view="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>工作
    </button>
    <button class="nav-item" data-view="routines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>例行工作
    </button>
    <button class="nav-item" data-view="meetings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>会议情况
    </button>
    <button class="nav-item" data-view="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>项目管理
    </button>
    <button class="nav-item" data-view="memos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/></svg>备忘录
    </button>
    <button class="nav-item" data-view="ideas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>灵感库
    </button>
    <button class="nav-item" data-view="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1z"/><path d="M9 14l2 2 4-4"/></svg>AI 复盘
    </button>
    <div class="spacer"></div>
    <button class="nav-item" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="title" id="viewTitle">日历</div>
      <span class="sync-badge" id="syncBadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span class="sb-text">本地存储</span>
      </span>
      <button class="btn" id="btnSync" title="立即同步到云端">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>同步
      </button>
      <button class="btn" id="btnExport" title="导出 JSON 备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>导出
      </button>
      <button class="btn" id="btnImport" title="导入恢复">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>导入

      <input type="file" id="codeFileInput" accept=".html,text/html" hidden>
    </header>

    <!-- 视图容器 -->
    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-routines"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-meetings"></section>
    <section class="view" id="view-projects"></section>
    <section class="view" id="view-memos"></section>
    <section class="view" id="view-ideas"></section>
    <section class="view" id="view-summary"></section>
    <section class="view" id="view-settings"></section>
  </div>
</div>

<!-- 移动端底部 Tab -->
<nav class="mobile-tab">
  <button data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>总览</button>
  <button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>工作</button>
  <button data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h8M8 18h8"/></svg>日历</button>
  <button data-view="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>项目</button>

<script>
(function(){
  "use strict";
  const STORE_KEY = "wb_workbench_data_v1";
  const SEED_FLAG  = "wb_workbench_seeded";
  const APP_VERSION = "2026.09.09.26";   // 工作台代码版本（每次改功能后由助手递增末位），用于跨设备"自检更新"
  const editing = {}; // 正在编辑的条目 id

  /* ---------- 工具 ---------- */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function dstr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function nowLocal(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
  function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }
  function addMonths(dstr,n){
    const p=String(dstr).split("-").map(Number);
    let y=p[0], m=(p[1]||1)-1, d=p[2]||1;
    m+=n; y+=Math.floor(m/12); m=((m%12)+12)%12;
    const max=new Date(y,m+1,0).getDate();
    if(d>max) d=max;
    return y+"-"+pad2(m+1)+"-"+pad2(d);
  }
  function pdate(dstr){ const p=String(dstr).split("-").map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const WEEKDAYS=["周日","周一","周二","周三","周四","周五","周六"];
  const WEEKORD=["第一周","第二周","第三周","第四周","最后一周"];
  function freqLabel(r){
    const f=r.freq;
    if(f==="daily") return "每天";
    if(f==="workday") return "每个工作日";
    if(f==="weekly") return "每周"+(WEEKDAYS[r.freqDetail||1]||"一");
    if(f==="monthlyDate") return "每月"+(r.freqDetail||1)+"号";
    if(f==="monthlyWeek") return "每月"+(WEEKORD[(r.freqWeekNum||1)-1]||"第一周")+"的"+(WEEKDAYS[r.freqWeekDay||1]||"周一");
    if(f==="monthlyRange"){ const s=r.rangeStart||1,e=r.rangeEnd||31; return s<=e?("每月"+s+"日–"+e+"日"):("每月"+s+"日–次月"+e+"日"); }
    if(f==="quarterlyDate") return "每季度第"+(r.qMonth||1)+"月"+(r.qDay||1)+"日";
    if(f==="quarterlyWeek") return "每季度第"+(r.qMonth||1)+"月第"+(WEEKORD[(r.qWeekNum||1)-1]||"第一周")+"的"+(WEEKDAYS[r.qWeekDay||1]||"周一");
    if(f==="quarterlyRange"){ const s=(r.qStartM||1),sd=(r.qStartD||1),e=(r.qEndM||3),ed=(r.qEndD||31); return "每季度第"+s+"月"+sd+"日–第"+e+"月"+ed+"日"; }
    if(f==="yearlyDate") return "每年"+(r.yMonth||1)+"月"+(r.yDay||1)+"日";
    if(f==="yearlyWeek") return "每年"+(r.yMonth||1)+"月第"+(WEEKORD[(r.yWeekNum||1)-1]||"第一周")+"的"+(WEEKDAYS[r.yWeekDay||1]||"周一");
    if(f==="yearlyRange"){ const s=(r.yStartM||1),sd=(r.yStartD||1),e=(r.yEndM||12),ed=(r.yEndD||31); return "每年"+s+"月"+sd+"日–"+e+"月"+ed+"日"; }
    return "每天";
  }
  function nthWeekdayOfMonth(year, month, weekday, nth){
    /* nth: 1-4 或 5(最后一周) */
    const first = new Date(year, month, 1);
    const lastDay = new Date(year, month+1, 0).getDate();
    const firstDow = first.getDay();
    let firstOccur = 1 + ((weekday - firstDow + 7) % 7);
    if(nth===5){
      /* 找该月最后一个 weekday */
      let lastOccur = firstOccur;
      while(lastOccur + 7 <= lastDay) lastOccur += 7;
      return lastOccur;
    }
    return firstOccur + (nth-1)*7;
  }
  function shiftMonths(y, m, n){ const nm=m+n; return { y: y+Math.floor(nm/12), m: ((nm%12)+12)%12 }; }
  function ymd(y, m, d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  /* 某日期是否命中某条例行规则（周期×模式 统一判定）。
     period=天/周/月/季/年，由 r.freq 前缀决定；mode=指定日/第N周周W/时间段 由 r.freq 后缀决定。 */
  function routineMatchDate(r, dstr){
    if(!r.enabled) return false;
    const d=pdate(dstr); if(isNaN(d)) return false;
    const y=d.getFullYear(), m=d.getMonth(), date=d.getDate(), dow=d.getDay();
    const f=r.freq;
    if(f==="daily") return true;
    if(f==="workday") return dow>=1 && dow<=5;
    if(f==="weekly") return dow===(r.freqDetail||0);
    if(f==="monthlyDate") return date===(r.freqDetail||1);
    if(f==="monthlyWeek") return date===nthWeekdayOfMonth(y,m,(r.freqWeekDay==null?1:r.freqWeekDay),r.freqWeekNum||1);
    if(f==="monthlyRange"){
      const s=r.rangeStart||1, e=r.rangeEnd||31;
      return (s<=e) ? (date>=s && date<=e) : (date>=s || date<=e);
    }
    if(f==="quarterlyDate"){
      const mq=(m%3)+1; return mq===(r.qMonth||1) && date===(r.qDay||1);
    }
    if(f==="quarterlyWeek"){
      const mq=(m%3)+1;
      if(mq!==(r.qMonth||1)) return false;
      return date===nthWeekdayOfMonth(y,m,(r.qWeekDay==null?1:r.qWeekDay),r.qWeekNum||1);
    }
    if(f==="quarterlyRange"){
      const mq=(m%3)+1, sm=r.qStartM||1, sd=r.qStartD||1, em=r.qEndM||3, ed=r.qEndD||31;
      if(sm<=em){
        if(mq<sm||mq>em) return false;
        if(mq===sm && date<sd) return false;
        if(mq===em && date>ed) return false;
        return true;
      }
      return (mq===sm && date>=sd) || (mq===em && date<=ed);
    }
    if(f==="yearlyDate") return m===(r.yMonth||1)-1 && date===(r.yDay||1);
    if(f==="yearlyWeek"){
      if(m!==(r.yMonth||1)-1) return false;
      return date===nthWeekdayOfMonth(y,m,(r.yWeekDay==null?1:r.yWeekDay),r.yWeekNum||1);
    }
    if(f==="yearlyRange"){
      const sm=(r.yStartM||1)-1, em=(r.yEndM||12)-1, sd=r.yStartD||1, ed=r.yEndD||31;
      if(sm<=em){
        if(m<sm||m>em) return false;
        if(m===sm && date<sd) return false;
        if(m===em && date>ed) return false;
        return true;
      }
      return (m===sm && date>=sd) || (m===em && date<=ed);
    }
    return false;
  }
  /* 判断某日期是否应生成例行任务，以及生成出的任务起止时间：
     - 时间段例行（monthlyRange/quarterlyRange/yearlyRange）：区间内任意一天都能生成，但只生成「一个」任务，
       任务时间段=设定的起止日。以"起始日"作为本次发生的唯一标识(routineOccKey)，保证一个时间段只有一条任务。
       跨期（如月28日–次月3日 / 季3月–次季1月 / 年11月–次年2月）通过稳定锚点计算，key 不随命中日漂移。
     - 单日例行：每个发生日生成一条，start=due=当天。 */
  function routineOccurrence(r, dstr){
    if(!r.enabled) return null;
    const d=pdate(dstr); if(isNaN(d)) return null;
    const y=d.getFullYear(), m=d.getMonth(), date=d.getDate();
    // —— 时间段（区间）型：返回锚定到起始日的稳定 occ ——
    if(r.freq==="monthlyRange"){
      const s=r.rangeStart||1, e=r.rangeEnd||31;
      let refY=y, refM=m;
      if(s>e && date<=e){ refM=m-1; if(refM<0){ refM=11; refY=y-1; } } // 落在"止月"时，锚回起始月
      const startStr = ymd(refY, refM, s);
      let ny=refY, nm=refM;
      if(s>e){ nm=refM+1; if(nm>11){ nm=0; ny=refY+1; } }
      return { key:r.id+"_"+startStr, start:startStr, due:ymd(ny,nm,e) };
    }
    if(r.freq==="quarterlyRange"){
      const qi=Math.floor(m/3), mq=(m%3)+1;
      const sm=r.qStartM||1, sd=r.qStartD||1, em=r.qEndM||3, ed=r.qEndD||31;
      const anchorQi = (mq>=sm) ? qi : (qi-1);   // 跨季时，落在"止月"(次季首月)需锚回起始季
      const baseM = anchorQi*3;
      const st=shiftMonths(y, baseM, sm-1);
      const en = (sm<=em) ? shiftMonths(y, baseM, em-1) : shiftMonths(y, baseM, em-1+3);
      const startStr = ymd(st.y, st.m, sd);
      return { key:r.id+"_"+startStr, start:startStr, due:ymd(en.y, en.m, ed) };
    }
    if(r.freq==="yearlyRange"){
      const sm=(r.yStartM||1)-1, sd=r.yStartD||1, em=(r.yEndM||12)-1, ed=r.yEndD||31;
      const anchorY = (sm>em && m<sm) ? y-1 : y;  // 跨年：命中"止月"(次年早月)时锚回起始年
      const st=shiftMonths(anchorY, 0, sm);
      const en = (sm<=em) ? shiftMonths(anchorY, 0, em) : shiftMonths(anchorY, 0, em+12);
      const startStr = ymd(st.y, st.m, sd);
      return { key:r.id+"_"+startStr, start:startStr, due:ymd(en.y, en.m, ed) };
    }
    // —— 单日型 ——
    if(!routineMatchDate(r, dstr)) return null;
    return { key:r.id+"_"+dstr, start: dstr, due: dstr };
  }
  /* 给定时间段例行任务已生成任务的 start 日期，反推其规范 occ（用于去重时判定"是否为同一发生"并修复起止）。 */
  function rangeOccFromStart(r, startStr){
    const d=pdate(startStr); if(isNaN(d)) return null;
    const y=d.getFullYear(), m=d.getMonth();
    if(r.freq==="monthlyRange"){
      const s=r.rangeStart||1, e=r.rangeEnd||31;
      const start=ymd(y,m,s);
      let ny=y, nm=m; if(s>e){ nm=m+1; if(nm>11){ nm=0; ny=y+1; } }
      return { key:r.id+"_"+start, start, due:ymd(ny,nm,e) };
    }
    if(r.freq==="quarterlyRange"){
      const qi=Math.floor(m/3), mq=(m%3)+1;
      const anchorQi = (mq>=(r.qStartM||1)) ? qi : (qi-1);
      const baseM = anchorQi*3;
      const st=shiftMonths(y, baseM, (r.qStartM||1)-1);
      const en = (r.qStartM||1)<=(r.qEndM||3) ? shiftMonths(y, baseM, (r.qEndM||3)-1) : shiftMonths(y, baseM, (r.qEndM||3)-1+3);
      const start=ymd(st.y, st.m, r.qStartD||1);
      return { key:r.id+"_"+start, start, due:ymd(en.y, en.m, r.qEndD||31) };
    }
    if(r.freq==="yearlyRange"){
      const sm=(r.yStartM||1)-1, em=(r.yEndM||12)-1;
      const anchorY = (sm>em && m<sm) ? y-1 : y;
      const st=shiftMonths(anchorY, 0, sm);
      const en = sm<=em ? shiftMonths(anchorY, 0, em) : shiftMonths(anchorY, 0, em+12);
      const start=ymd(st.y, st.m, r.yStartD||1);
      return { key:r.id+"_"+start, start, due:ymd(en.y, en.m, r.yEndD||31) };
    }
    return null;
  }
  /* 例行规则「签名」：只看标题 + 周期 + 参数，忽略 id / created / enabled。
     同一条规则被重复创建（例如在手机上又建了一遍「正常价目 每月1-15号」），签名就会相同。 */
  function routineSig(r){
    if(!r) return "";
    const v=(x,d)=> (x===undefined||x===null)?d:x;
    return [String(r.title||"").trim(), r.freq||"",
      v(r.freqDetail,0), v(r.freqWeekNum,0), v(r.freqWeekDay,0),
      v(r.rangeStart,0), v(r.rangeEnd,0),
      v(r.qMonth,0), v(r.qDay,0), v(r.qStartM,0), v(r.qStartD,0), v(r.qEndM,0), v(r.qEndD,0),
      v(r.yMonth,0), v(r.yDay,0), v(r.yStartM,0), v(r.yStartD,0), v(r.yEndM,0), v(r.yEndD,0)
    ].join("|");
  }
  /* 合并重复例行规则（自愈）：保留 id 字典序最小的一条 —— 两端同步时选择一致，不会来回抖动。
     被合并掉的规则：其名下未完成的自动任务删除（保留的那条会继续生成），已完成的历史改挂到保留规则。 */
  function mergeDuplicateRoutines(){
    if(!state.routines || !state.tasks) return 0;
    const groups={};
    state.routines.forEach(r=>{ if(!r||!r.id) return; const k=routineSig(r); (groups[k]=groups[k]||[]).push(r); });
    const keepIds=new Set();
    let merged=0;
    Object.keys(groups).forEach(k=>{
      const arr=groups[k];
      arr.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
      const keep=arr[0];
      keepIds.add(keep.id);
      if(arr.length<=1) return;
      if(arr.some(x=>x.enabled)) keep.enabled=true;   // 任一副本启用 -> 保留规则保持启用
      arr.slice(1).forEach(dup=>{
        markTomb(dup.id);   // 被合并的重复规则打墓碑，防止从云端复活
        state.tasks.forEach(t=>{
          if(!t || t.routineId!==dup.id) return;
          const isAuto = typeof t.id==="string" && t.id.indexOf("rt_")===0;
          const isHistory = t.status==="done" || t.archived;
          if(!isHistory && isAuto){ t._drop=true; }
          else { t.routineId=keep.id; t.routineOccKey=String(t.routineOccKey||"").split(dup.id).join(keep.id); }
        });
        merged++;
      });
    });
    if(merged>0){
      state.tasks.forEach(t=>{ if(t._drop) markTomb(t.id); });
      state.tasks = state.tasks.filter(t=>!t._drop);
      state.routines = state.routines.filter(r=> keepIds.has(r.id));
      save();
    }
    return merged;
  }
  function routineGenerated(r, key){
    // 已生成的判定：只要存在该次发生(key)的任务即视为已生成；仅当用户主动归档/删除(archived)时才允许重建。
    // 注意：不能把"已完成(done)"排除在外——否则区间例行任务一旦被标完成，次日 routineGenerated 会返回 false 而重新生成一条同样的，
    // 导致区间内"每天一条"的重复（这正是 2026.09.03.2 的 bug）。
    return state.tasks.some(x=> x.routineId===r.id && x.routineOccKey===key && !x.archived);
  }
  /* 自愈式清理例行任务（启动 / 保存例行规则时执行）：
     1) 校验：带 routineId 的任务，其到期日必须仍命中该规则的当前发生——
        区间型(月/季/年时间段)还须落在本次发生的 [start,due] 区间内。
        不命中的就是"规则改过之后的过期残留"（例如改成每月1-15日后残存的旧每周一任务），直接清理。
        这是甘特图出现幽灵条的根源之一。
     2) 修复：命中当前规则但 key/起止不规范的老任务，对齐为规范锚定 occ。
     3) 去重：同一发生（routineId+OccKey 精确分组）只保留一条，优先保留未完成的那条。
        注意绝不能按"年月"分组去重——每天/每周型例行同月本来就有多条，按月合并会误删历史。
     孤儿任务（规则已删除）按「已生成的工作不受影响」约定保留历史；其中未完成的自动生成任务（id 以 rt_ 开头）视为垃圾清理。 */
  function dedupeRoutineTasks(){
    if(!state.tasks || !state.routines) return 0;
    let removed = 0;
    const RANGE=["monthlyRange","quarterlyRange","yearlyRange"];
    for(let i=state.tasks.length-1; i>=0; i--){
      const t=state.tasks[i];
      if(!t || !t.routineId) continue;
      const r = state.routines.find(x=>x.id===t.routineId);
      const isAuto = typeof t.id==="string" && t.id.indexOf("rt_")===0;
      const isHistory = t.status==="done" || t.archived;
      if(!r){
        if(isAuto && !isHistory){ const dead=state.tasks[i]; state.tasks.splice(i,1); markTomb(dead.id); removed++; }   // 孤儿的未完成自动任务
        continue;
      }
      const due = t.due;
      const occ = due ? routineOccurrence(r, due) : null;
      let valid = false;
      if(occ){
        if(RANGE.includes(r.freq)) valid = (due>=occ.start && due<=occ.due);
        else valid = true;                    // 单日型：due 命中规则即为有效发生
      }
      if(!valid){
        if(!isHistory){ const dead=state.tasks[i]; state.tasks.splice(i,1); markTomb(dead.id); removed++; }             // 过期残留（保留已完成历史）
        continue;
      }
      if(RANGE.includes(r.freq)){
        if(t.routineOccKey!==occ.key || t.start!==occ.start || t.due!==occ.due){
          t.routineOccKey=occ.key; t.start=occ.start; t.due=occ.due;
        }
      } else if(t.routineOccKey!==occ.key || !t.start){
        t.routineOccKey=occ.key; t.start=due;
      }
    }
    const dropDup = (arr)=>{
      if(arr.length<=1) return 0;
      let n=0;
      const todo = arr.find(t=> t.status!=="done" && !t.archived);
      const keep = todo || arr.slice().sort((a,b)=>(b.created||"").localeCompare(a.created||""))[0];
      arr.forEach(t=>{ if(t!==keep){ const i=state.tasks.indexOf(t); if(i>=0){ state.tasks.splice(i,1); markTomb(t.id); n++; } } });
      return n;
    };
    const byKey = {};
    state.tasks.forEach(t=>{
      if(!t || !t.routineId || !t.routineOccKey) return;
      const k=t.routineId+"|"+t.routineOccKey;
      (byKey[k]=byKey[k]||[]).push(t);
    });
    Object.keys(byKey).forEach(k=>{ removed += dropDup(byKey[k]); });
    /* 二级去重：区间型（月/季/年时间段）同一规则的同一 [start,due] 区间只保留一条。
       即使 routineOccKey 因历史版本漂移不一致，同一区间也不会出现两条一模一样的任务。 */
    const byRange = {};
    state.tasks.forEach(t=>{
      if(!t || !t.routineId || !t.start || !t.due) return;
      const rr=state.routines.find(x=>x.id===t.routineId);
      if(!rr || RANGE.indexOf(rr.freq)<0) return;
      const k=t.routineId+"|"+t.start+"~"+t.due;
      (byRange[k]=byRange[k]||[]).push(t);
    });
    Object.keys(byRange).forEach(k=>{ removed += dropDup(byRange[k]); });
    if(removed>0){ save(); toast("已清理 "+removed+" 条过期/重复的例行任务"); }
    return removed;
  }
  function generateRoutines(targetDate, silent){
    const t = targetDate || todayStr();
    let n=0;
    const RANGEF=["monthlyRange","quarterlyRange","yearlyRange"];
    state.routines.forEach(r=>{
      const occ = routineOccurrence(r, t);
      if(!occ) return;
      if(routineGenerated(r, occ.key)) return;

     已实例化（routineGenerated）的由真实任务负责渲染。 */
  function routineTasksForRange(startStr, endStr){
    const list=[]; const seen=new Set();
    const start=pdate(startStr), end=pdate(endStr);
    if(!state.routines || isNaN(start) || isNaN(end)) return list;
    const DAY=86400000;
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const ds=dstr(d);
      state.routines.forEach(r=>{
        if(!r.enabled) return;
        const occ=routineOccurrence(r, ds);
        if(!occ || seen.has(occ.key)) return;
        // 只补充与可视区间有重叠的 occ，防止上个月的区间任务在过期后仍出现在未来周
        const occStart=pdate(occ.start), occDue=pdate(occ.due);
        if(isNaN(occStart) || isNaN(occDue) || occDue < start || occStart > end) return;
        const alreadyExists = state.tasks.some(x=> x.routineId===r.id && x.routineOccKey===occ.key);
        if(alreadyExists) return;
        seen.add(occ.key);
        list.push({
          id:"rt_"+occ.key,
          title:r.title, type:"temp", status:"todo",
          start:occ.start, due:occ.due,
          note:r.note||"",
          routineId:r.id, routineOccKey:occ.key,
          created:ds, sample:r.sample?true:false
        });
      });
    }
    return list;

    function parse(dstr){ const p=String(dstr).split("-").map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }
    /* ===== 代办甘特图（按周查看，7 天，周一~周日） ===== */
    const gF = new Date(ganttAnchor.getFullYear(), ganttAnchor.getMonth(), ganttAnchor.getDate());
    const gdow = gF.getDay();
    gF.setDate(gF.getDate() - (gdow===0 ? 6 : gdow-1));   // 回退到本周一（窗口为周一~周日）
    let start = new Date(gF);
    let end = new Date(gF); end.setDate(end.getDate()+6);   // 本周日
    const startStr=dstr(start), endStr=dstr(end);
    const baseTasks = state.tasks.filter(x=>{
      if(!x.due || x.archived || x.status==="done") return false;
      const due=parse(x.due); if(isNaN(due)) return false;
      const s0 = x.start ? parse(x.start) : due;
      if(isNaN(s0)) return false;
      return due>=start && s0<=end;   // 区间重叠即可，支持跨周/跨月的长期任务
    });
    const tasks = baseTasks.concat(routineTasksForRange(startStr, endStr));
    const numDays = 7;
    function idxOf(dstr){ let i=Math.round((mid(parse(dstr))-mid(start))/DAY); return Math.max(0,Math.min(numDays-1,i)); }
    const _mainEl = document.querySelector(".main");
    const _mw = _mainEl ? _mainEl.clientWidth : 0;
    const COLW = Math.min(160, Math.max(84, Math.floor((Math.max(_mw, 760) - 48) / 7)));   // 7 天铺满容器宽度
    let head="";
    for(let i=0;i<numDays;i++){
      const d=new Date(start); d.setDate(d.getDate()+i);
      const wd=["日","一","二","三","四","五","六"][d.getDay()];
      const isT = i===idxOf(t);
      const we = (d.getDay()===0||d.getDay()===6);
      head += `<div class="gcell${isT?' gtoday':''}${we?' gweekend':''}"><span class="gd">${d.getDate()}</span><span class="gw">${wd}</span></div>`;
    }
    let rows=""; let brow=2;
    tasks.forEach(x=>{
      const p=x.due.split("-").map(Number); const dueD=new Date(p[0],p[1]-1,p[2]);
      const di=idxOf(x.due);
      let si=di;
      const s0 = x.start;
      const showStart = s0 && s0 !== x.due;
      if(showStart){ const ci=idxOf(s0); if(ci<di) si=ci; }
      const overdue = x.due < t;
      const diff = Math.round((mid(dueD)-today)/DAY);
      const cls = overdue?"g-over":(diff<=3?"g-soon":"g-norm");
      rows += `<div class="gbar ${cls}" style="grid-row:${brow++};grid-column:${si+1}/${di+2}" title="${esc(x.title)}｜${showStart?('起 '+esc(s0)+' · '):''}到期 ${esc(x.due)}"><span class="gbar-t">${esc(x.title)}</span></div>`;
    });
    let ganttHtml = `<div class="gantt-wrap"><div class="scroll-hint">← 左右滑动查看 →</div><div class="gantt-scroll"><div class="gantt-grid" style="--gd:${numDays};--gc:${COLW}px">${head}${rows}</div></div></div>`;
    /* ===== 会议日历（周 / 月） ===== */
    const first = calFirstDay();
    const dows=["日","一","二","三","四","五","六"];
    const dowHtml = dows.map(w=>`<div class="cal-dow">${w}</div>`).join("");
    let gridDays, label, gstart;
    if(calMode==="month"){
      const startDow = first.getDay();
      const daysInMonth = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
      gstart = new Date(first.getFullYear(), first.getMonth(), 1 - startDow);
      gridDays = Math.ceil((startDow + daysInMonth)/7)*7;
      label = first.getFullYear()+" 年 "+(first.getMonth()+1)+" 月";
    }else{
      gstart = first;
      gridDays = 7;
      const wkEnd = new Date(first.getFullYear(), first.getMonth(), first.getDate()+6);
      label = "本周（"+dstr(first)+" ~ "+dstr(wkEnd)+"）";
    }
    let grid="";
    for(let i=0;i<gridDays;i++){
      const d=new Date(gstart); d.setDate(gstart.getDate()+i);
      const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
      const ds = y+"-"+pad2(m)+"-"+pad2(day);
      const inView = calMode==="month" ? (d.getMonth()===first.getMonth()) : true;
      const isT = ds===t;
      const dayMeets = state.meetings.filter(x=>x.date===ds).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
      let chips="";
      if(dayMeets.length){
        chips = dayMeets.map(x=>{
          const lbl=(x.time?('<span class="ct">'+esc(x.time)+'</span>'):'')+esc(x.title)+(x.location?(' · '+esc(x.location)):'');
          return `<div class="cal-chip" data-mid="${esc(x.id)}">${lbl}</div>`;
        }).join("");
      }else if(inView){
        chips = `<div class="cal-empty">—</div>`;
      }
      grid += `<div class="cal-cell${inView?'':' out'}${isT?' today':''}"><span class="cd">${day}</span>${chips}</div>`;
    }
    let html = dailyTasksHtml();
    html += `<div class="view-head"><span class="sub">工作甘特图 + 会议日历（可切换周 / 月）</span></div>`;
    const ganttLabel = dstr(start)+" ~ "+dstr(end);
    const ganttNav = `<div class="cal-nav no-print">
      <button class="btn" id="gantt-prev">‹ 上一周</button>
      <span class="cal-m">${ganttLabel}</span>
      <button class="btn" id="gantt-next">下一周 ›</button>
      <button class="btn btn-ghost" id="gantt-this">回到本周</button>
    </div>`;
    html += `<div class="sub-head">工作甘特图<small>按周查看（红=逾期 · 橙=3日内 · 蓝=充裕）</small></div>`;
    html += ganttNav + ganttHtml;
    html += `<div class="sub-head">会议日历<small>按周 / 月查看每日会议，可切换</small></div>`;
    html += `<div class="cal-nav no-print">
      <div class="cal-mode seg" style="margin:0">
        <button id="cal-mode-month" class="${calMode==='month'?'active':''}">月</button>
        <button id="cal-mode-week" class="${calMode==='week'?'active':''}">周</button>
      </div>
      <button class="btn" id="cal-prev">‹ 上一${calMode==='month'?'月':'周'}</button>
      <span class="cal-m">${label}</span>
      <button class="btn" id="cal-next">下一${calMode==='month'?'月':'周'} ›</button>
      <button class="btn btn-ghost" id="cal-this">回到本${calMode==='month'?'月':'周'}</button>
    </div>`;
    html += `<div class="cal-grid cal-compact">${dowHtml}${grid}</div>`;
    document.getElementById("view-calendar").innerHTML = html;
    const prev=document.getElementById("cal-prev"); if(prev) prev.onclick=()=>{ if(calMode==="month"){ calAnchor.setMonth(calAnchor.getMonth()-1); } else { calAnchor.setDate(calAnchor.getDate()-7); } renderCalendar(); };
    const next=document.getElementById("cal-next"); if(next) next.onclick=()=>{ if(calMode==="month"){ calAnchor.setMonth(calAnchor.getMonth()+1); } else { calAnchor.setDate(calAnchor.getDate()+7); } renderCalendar(); };
    const thisBtn=document.getElementById("cal-this"); if(thisBtn) thisBtn.onclick=()=>{ calAnchor=new Date(); renderCalendar(); };
    const mm=document.getElementById("cal-mode-month"); if(mm) mm.onclick=()=>{ calMode="month"; renderCalendar(); };
    const mw=document.getElementById("cal-mode-week"); if(mw) mw.onclick=()=>{ calMode="week"; renderCalendar(); };
    const gp=document.getElementById("gantt-prev"); if(gp) gp.onclick=()=>{ ganttAnchor.setDate(ganttAnchor.getDate()-7); renderCalendar(); };
    const gn=document.getElementById("gantt-next"); if(gn) gn.onclick=()=>{ ganttAnchor.setDate(ganttAnchor.getDate()+7); renderCalendar(); };
    const gt=document.getElementById("gantt-this"); if(gt) gt.onclick=()=>{ ganttAnchor=new Date(); renderCalendar(); };
    document.querySelectorAll("#view-calendar .cal-chip").forEach(chip=>{
      const m = state.meetings.find(x=>x.id===chip.getAttribute("data-mid"));
      if(m){ chip.onmouseenter = e=>showCalTooltip(e,m); chip.onmouseleave = hideCalTooltip; }
    });
    bindItemEvents(document.getElementById("view-calendar"));
  }

    document.querySelectorAll(".nav-item,.mobile-tab button,.more-sheet .ms-item").forEach(b=>{

      if(bv) b.classList.toggle("active", bv===v);

      if(!v) return;
      const svg=b.querySelector("svg");
      const el=document.createElement("button");
      el.className="ms-item";

  let flt = { tasks:{f:"todo",q:""}, projects:{f:"todo",q:""}, memos:{f:"todo",q:"",g:"note"} };
  function filterBarHtml(scope){
    const f=flt[scope].f;
    /* 备忘录专属：顶部「备忘 / ERP」分区切换。ERP 是资料不是待办，故隐藏「全部/未完成/已完成」状态栏 */
    let groupRow="", statusRow=`<div class="seg">

  /* ---------- 工作（临时工作） ---------- */
  function tagPills(tags){
    if(!tags) return "";
    return String(tags).split(/[,，]/).map(s=>s.trim()).filter(Boolean).map(s=>`<span class="tag tag-usr">${esc(s)}</span>`).join("");
  }
  function cleanNote(n){
    return String(n||"").replace(/（来自例行工作）/g,"").replace(/^[\s·]+|[\s·]+$/g,"").trim();
  }
  function taskSubText(x, overdue){
    if(x.flash){
      let s='<span class="tag" style="background:#fff0e6;color:#d9480f;border-color:#ffd8a8">突发事项</span>';
      if(!x.due && !x.start && x.regTime) s+='　登记 '+esc(x.regTime);
      s+=tagPills(x.tags);
      return s;
    }
    let s='';
    if(!x.due) s='未排期';
    else if(overdue) s='<span class="due-over">逾期 '+esc(x.due)+'</span>';
    else if(x.remind) s='到期 '+esc(x.due);
    else s=((x.start&&x.start!==x.due)?(esc(x.start)+' → '):'进行中 · 至 ')+esc(x.due);
    const n=cleanNote(x.note);
    if(n) s+=' · '+esc(n);
    s+=tagPills(x.tags);
    return s;
  }

  function renderTasks(){
    let html = dailyTasksHtml() + `<div class="view-head"><span class="sub">${viewMeta.tasks.s}</span><button class="btn btn-ghost" data-go="routines" style="margin-left:auto">⚙ 配置例行工作</button></div>`;

    html += `<div id="task-list"></div>`;
    document.getElementById("view-tasks").innerHTML = html;
    const ttAdd=document.getElementById("tt-add");
    const ttRem=document.getElementById("tt-remind");
    const ttStartF=document.getElementById("tt-start-field");
    const ttFlashEl=document.getElementById("tt-flash");
    function updateFlashFields(){
      const on = ttFlashEl?ttFlashEl.checked:false;

  /* ---------- 备忘录 ----------
     分为两个互不干扰的分区：note（普通备忘：有完成状态、可手动排序）
     与 erp（账号密码：无完成状态、不排序、不进月报统计）。 */
  function memoGroup(x){ return (x && x.group==="erp") ? "erp" : "note"; }
  /* 复制到剪贴板：https / localhost 用异步 API，其余环境回退到 execCommand */
  function copyText(t){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function(res,rej){
      try{
        const ta=document.createElement("textarea");
        ta.value=t; ta.style.position="fixed"; ta.style.top="-1000px"; ta.setAttribute("readonly","");
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length);
        const ok=document.execCommand("copy"); ta.remove();
        ok ? res() : rej(new Error("execCommand copy failed"));
      }catch(e){ rej(e); }
    });
  }
  /* ---------- 备忘录手动排序 ----------
     order 为数字，越小越靠前。新增的备忘放在最前；点 ↑ / ↓ 与相邻条目交换位置后整列重编号。 */
  function memoOrder(x){ return typeof x.order==="number" ? x.order : 1e9; }
  function memoSorted(){
    return [...state.memos].sort((a,b)=>
      (memoOrder(a)-memoOrder(b)) || (b.updated||b.created||"").localeCompare(a.updated||a.created||""));
  }
  function ensureMemoOrder(){
    if(!state.memos || !state.memos.length) return;
    state.memos.forEach(x=>{ if(memoGroup(x)!=="erp") x.group="note"; });   // 老数据/同步数据补齐分区字段
    const missing = state.memos.filter(x=> typeof x.order!=="number");
    if(!missing.length) return;
    if(missing.length===state.memos.length){
      // 全部是旧数据：按原来的「最近更新在前」编号，保持用户看到的顺序不变
      [...state.memos].sort((a,b)=>(b.updated||b.created||"").localeCompare(a.updated||a.created||""))
        .forEach((x,i)=>{ x.order=i; });
    }else{
      // 少数缺失（多为同步过来的新条目）：排到最前面
      let m=Math.min.apply(null, state.memos.filter(x=>typeof x.order==="number").map(x=>x.order));
      if(!isFinite(m)) m=0;
      missing.forEach(x=>{ x.order = --m; });
    }
  }
  function memoViewList(){
    const f=flt.memos.f, q=flt.memos.q.toLowerCase(), g=flt.memos.g;
    let list=memoSorted().filter(x=> memoGroup(x)===g);   // 两个分区互不串门
    if(g!=="erp"){
      if(f==="todo") list=list.filter(x=> !x.done);
      else if(f==="done") list=list.filter(x=> x.done);
    }
    if(q) list=list.filter(x=>{
      if(memoGroup(x)==="erp"){
        // 密码不参与搜索，避免在旁人面前搜出明文
        return [x.title,x.account,x.note].filter(Boolean).join(" ").toLowerCase().includes(q);
      }
      return ((x.title||"")+" "+(x.content||"")).toLowerCase().includes(q);
    });
    return list;
  }
  function moveMemo(id, dir){
    const vis=memoViewList();
    const i=vis.findIndex(x=>x.id===id);
    if(i<0) return;
    const j=i+dir;
    if(j<0 || j>=vis.length){ toast(dir<0?"已经在最前面了":"已经在最后面了"); return; }
    const full=memoSorted();
    const a=full.findIndex(x=>x.id===vis[i].id);
    const b=full.findIndex(x=>x.id===vis[j].id);
    if(a<0 || b<0) return;
    const tmp=full[a]; full[a]=full[b]; full[b]=tmp;   // 在全量列表里交换，再整体重编号
    full.forEach((x,k)=>{ x.order=k; });
    save(); renderMemoList();
  }

  /* ---------- 项目管理（长周期任务 · 可登记进度） ---------- */
  function projCard(x){
    if(editing[x.id]){
      return `<div class="card"><div class="edit-box">
        <input id="e-title" value="${esc(x.title)}">
        <div class="form-grid"><input id="e-date" type="date" value="${esc(x.date||'')}"><input id="e-note" value="${esc(x.note||'')}" placeholder="项目说明"></div>
        <div class="edit-actions"><button class="btn" data-cancel="${x.id}">取消</button><button class="btn btn-primary" data-save="projects:${x.id}">保存</button></div>
      </div></div>`;
    }
    const prog = x.progress || [];
    const last = prog[prog.length-1];
    const showAll = editing["allprog:"+x.id];
    let progHtml;
    if(prog.length){
      const visible = showAll ? prog : [last];
      const li = visible.map(p=>`<li><span class="ppt">${esc(p.t)}</span>${esc(p.text)}</li>`).join("");
      const headTxt = showAll ? ('全部进度（'+prog.length+' 条）') : ('最新进度（共 '+prog.length+' 条，仅显示最新一条）');
      progHtml = `<div class="proj-prog"><div class="pp-t">${headTxt}</div><ul class="pp-list">${li}</ul>`
        + (prog.length>1 ? `<button class="btn btn-ghost" data-pall="${x.id}" style="margin-top:8px">${showAll?'收起':'展开全部 '+prog.length+' 条进度'}</button>` : '')
        + `</div>`;
    }else{
      progHtml = `<div class="proj-prog"><div class="pp-t">尚未登记进度，点击「+」登记最新进展</div></div>`;
    }
    let form="";
    if(editing["prog:"+x.id]){
      form = `<div class="prog-form">
        <div class="form-grid"><input id="pg-date-${x.id}" type="date" value="${todayStr()}" title="进度日期"><textarea id="pg-text-${x.id}" placeholder="登记本次进度…"></textarea></div>
        <div class="edit-actions"><button class="btn" data-pcancel="${x.id}">取消</button><button class="btn btn-primary" data-psave="${x.id}">保存进度</button></div>
      </div>`;
    }
    return `<div class="card"><div class="item-row">
      <div class="item-main">
        <div class="item-title">${esc(x.title)}</div>
        ${x.date?`<div class="item-sub">项目日期：${esc(x.date)}</div>`:''}
        ${x.note?`<div class="item-sub">${esc(x.note)}</div>`:''}
        <div class="item-sub" style="font-size:12px">创建于 ${esc(x.created||'')}${last?(' · 最近更新 '+esc(last.t)):''}</div>
        ${progHtml}${form}
      </div>
      <div class="item-actions">
        <button class="icon-btn" data-preg="${x.id}" title="登记进度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" data-edit="${x.id}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
        <button class="icon-btn" data-parch="${x.id}" title="归档"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg></button>
        <button class="icon-btn danger" data-pdel="${x.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>
    </div></div>`;
  }

  function renderProjectList(){
    const box=document.getElementById("project-list"); if(!box) return;
    const f=flt.projects.f, q=flt.projects.q.toLowerCase();
    let active=[...state.projects].filter(x=>!x.archived);
    let arch=[...state.projects].filter(x=>x.archived);
    if(f==="todo") arch=[];
    else if(f==="done") active=[];
    if(q){
      active=active.filter(x=> (x.title||"").toLowerCase().includes(q) || (x.note||"").toLowerCase().includes(q));
      arch=arch.filter(x=> (x.title||"").toLowerCase().includes(q) || (x.note||"").toLowerCase().includes(q));
    }
    let h="";
    if(!active.length && !arch.length){ h='<div class="card empty">没有符合条件的项目</div>'; }

      h += `<div class="sub-head">进行中项目<small>${active.length} 个</small></div>`;
      active.forEach(x=> h += projCard(x));
    }
    if(arch.length){
      const totalProg = arch.reduce((s,p)=>s+(p.progress?p.progress.length:0),0);
      h += `<div class="sub-head">已完成项目<small>${arch.length} 个 · 共 ${totalProg} 条进度记录</small></div>`;
      arch.forEach(x=>{
        const prog = x.progress||[];
        let progHtml="";
        if(prog.length){
          const li = prog.map(p=>`<li><span class="ppt">${esc(p.t)}</span>${esc(p.text)}</li>`).join("");
          progHtml = `<div class="proj-prog"><div class="pp-t">全部进度（${prog.length} 条）</div><ul class="pp-list">${li}</ul></div>`;
        }
        h += `<div class="card"><div class="item-row">
          <div class="item-main">
            <div class="item-title" style="text-decoration:line-through;color:var(--muted)">${esc(x.title)}</div>
            ${x.date?`<div class="item-sub">项目日期：${esc(x.date)}</div>`:''}
            ${x.note?`<div class="item-sub">${esc(x.note)}</div>`:''}
            <div class="item-sub" style="font-size:12px">创建于 ${esc(x.created||'')}</div>
            ${progHtml}
          </div>
          <div class="item-actions">
            <button class="icon-btn" data-prestore="${x.id}" title="恢复到项目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="icon-btn danger" data-pdel="${x.id}" title="彻底删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
          </div>
        </div></div>`;
      });
    }
    box.innerHTML = h;
    const root=box;
    root.querySelectorAll("[data-preg]").forEach(b=>b.onclick=()=>{ editing["prog:"+b.getAttribute("data-preg")]=true; renderProjectList(); });
    root.querySelectorAll("[data-pcancel]").forEach(b=>b.onclick=()=>{ delete editing["prog:"+b.getAttribute("data-pcancel")]; renderProjectList(); });
    root.querySelectorAll("[data-pall]").forEach(b=>b.onclick=()=>{ const id=b.getAttribute("data-pall"); editing["allprog:"+id]=!editing["allprog:"+id]; renderProjectList(); });
    root.querySelectorAll("[data-psave]").forEach(b=>b.onclick=()=>{
      const id=b.getAttribute("data-psave"); const pj=state.projects.find(x=>x.id===id); if(!pj) return;
      const txt=document.getElementById("pg-text-"+id).value.trim();
      if(!txt){ toast("请填写进度内容"); return; }
      const d=document.getElementById("pg-date-"+id).value || todayStr();
      const now=new Date(); const ts=d+" "+pad2(now.getHours())+":"+pad2(now.getMinutes());
      pj.progress=pj.progress||[]; pj.progress.push({t:ts, text:txt});
      delete editing["prog:"+id]; save(); renderProjectList(); toast("进度已登记（"+ts+"）");
    });
    root.querySelectorAll("[data-parch]").forEach(b=>b.onclick=()=>{
      const pj=state.projects.find(x=>x.id===b.getAttribute("data-parch")); if(!pj) return;
      if(confirm("归档该项目？归档后会进入「已完成项目」，所有进度记录都会保留。")){ pj.archived=true; save(); renderProjectList(); toast("已归档（进入已完成项目）"); }
    });
    root.querySelectorAll("[data-prestore]").forEach(b=>b.onclick=()=>{
      const pj=state.projects.find(x=>x.id===b.getAttribute("data-prestore")); if(!pj) return;
      pj.archived=false; save(); renderProjectList(); toast("已恢复项目");
    });
    root.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{
      if(confirm("彻底删除该项目？")){ const pid=b.getAttribute("data-pdel"); state.projects=state.projects.filter(x=>x.id!==pid); markTomb(pid); delete editing[pid]; save(); renderProjectList(); toast("已删除"); }
    });
    bindItemEvents(box);
  }

  /* ---------- AI 复盘（日 / 周 / 月 · 导出 PDF） ---------- */
  let repPeriod = "week";
  function periodRange(period){
    const now=new Date(); now.setHours(0,0,0,0);
    if(period==="day"){ return {from:todayStr(), to:todayStr(), label:todayStr()}; }
    if(period==="week"){ const dow=now.getDay(); const mon=new Date(now); mon.setDate(now.getDate()-(dow===0?6:dow-1)); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:dstr(mon), to:dstr(sun), label:dstr(mon)+" ~ "+dstr(sun)}; }
    const m1=new Date(now.getFullYear(),now.getMonth(),1), m2=new Date(now.getFullYear(),now.getMonth()+1,0);
    return {from:dstr(m1), to:dstr(m2), label:now.getFullYear()+" 年 "+(now.getMonth()+1)+" 月"};
  }
  function inPeriod(dateStr, period){
    if(!dateStr) return false;
    const d=pdate(dateStr); if(isNaN(d)) return false;
    const now=new Date(); now.setHours(0,0,0,0);
    if(period==="day"){ return dateStr===todayStr(); }
    if(period==="week"){ const dow=now.getDay(); const mon=new Date(now); mon.setDate(now.getDate()-(dow===0?6:dow-1)); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return d>=mon && d<=sun; }
    if(period==="month"){ const m1=new Date(now.getFullYear(),now.getMonth(),1), m2=new Date(now.getFullYear(),now.getMonth()+1,0); return d>=m1 && d<=m2; }
    return false;
  }
  function autoNarrative(s){
    const p = s.period==="day"?"今日":(s.period==="week"?"本周":"本月");
    if(s.done===0 && s.overdue===0 && s.meets===0 && s.prog===0){
      return p+"整体节奏平稳，暂无新增完成项与会议记录。可抽空梳理下一步计划，保持项目推进。";
    }
    const parts=[];
    if(s.done>0) parts.push("完成 "+s.done+" 项工作");
    if(s.meets>0) parts.push("召开 "+s.meets+" 场会议");
    if(s.prog>0) parts.push("推进 "+s.prog+" 次项目进度");
    let main = p+parts.join("、")+"。";
    main += s.overdue>0 ? ("需重点关注 "+s.overdue+" 项逾期待办，建议优先清理或调整排期。") : "各项任务进度正常，无明显逾期风险。";
    return main;
  }
  function renderSummary(){
    const period = repPeriod;
    const labels={day:"每日工作复盘", week:"本周工作周报", month:"本月工作月报"};
    const rng = periodRange(period);
    const doneTasks = state.tasks.filter(x=> (x.status==="done"||x.archived) && x.doneAt && inPeriod(x.doneAt, period));
    const overdueTasks = state.tasks.filter(x=> !(x.archived||x.status==="done") && x.due && x.due<todayStr());
    const periodMeetings = state.meetings.filter(x=> inPeriod(x.date, period));
    const progUpdates = [];
    state.projects.forEach(p=>{ (p.progress||[]).forEach(pr=>{ if(inPeriod(String(pr.t).split(" ")[0], period)) progUpdates.push({proj:p.title, t:pr.t, text:pr.text}); }); });
    const newMemos = state.memos.filter(x=> memoGroup(x)!=="erp" && inPeriod(String(x.updated||x.created||"").split(" ")[0], period));   // ERP 账号不计入工作复盘
    const newIdeas = state.ideas.filter(x=> inPeriod(x.created, period));
    const flashList = state.tasks.filter(x=> x.flash && ((x.doneAt&&inPeriod(x.doneAt, period)) || (!x.doneAt && inPeriod(x.created, period))));
    const kpis = [
      {n:doneTasks.length, l:"完成工作"},
      {n:overdueTasks.length, l:"逾期待办"},
      {n:periodMeetings.length, l:"召开会议"},
      {n:progUpdates.length, l:"项目进度更新"},
      {n:newMemos.length, l:"新增备忘"},
      {n:newIdeas.length, l:"新增灵感"},
      {n:flashList.length, l:"突发事项"}
    ];
    const kpiHtml = kpis.map(k=>`<div class="kpi"><div class="n">${k.n}</div><div class="l">${k.l}</div></div>`).join("");
    const listHtml=(arr, fn)=> !arr.length ? '<div class="cal-empty">本期无</div>' : '<ul class="rep-list">'+arr.map(fn).join("")+'</ul>';
    const doneList = listHtml(doneTasks, x=>`<li>${esc(x.title)}${x.due?('（原定 '+esc(x.due)+'）'):''}</li>`);
    const overdueList = listHtml(overdueTasks, x=>`<li>${esc(x.title)}（到期 ${esc(x.due)}）</li>`);
    const meetList = listHtml(periodMeetings, x=>`<li>${esc((x.date||'')+' '+(x.time||''))} ｜ ${esc(x.title)}${x.location?(' ｜ '+esc(x.location)):''}</li>`);
    const progList = listHtml(progUpdates, x=>`<li><b>${esc(x.proj)}</b> · ${esc(x.t)}：${esc(x.text)}</li>`);
    const narr = autoNarrative({period, done:doneTasks.length, overdue:overdueTasks.length, meets:periodMeetings.length, prog:progUpdates.length});
    let html = `<div class="view-head"><span class="sub">${viewMeta.summary.s}</span></div>`;
    html += `<div class="seg no-print">
      <button data-rep="day" class="${period==='day'?'active':''}">每日复盘</button>
      <button data-rep="week" class="${period==='week'?'active':''}">每周周报</button>
      <button data-rep="month" class="${period==='month'?'active':''}">每月月报</button>
      <button class="btn btn-primary" id="rep-pdf" style="margin-left:auto">导出 PDF</button>
    </div>`;
    html += `<div id="rep-body">
      <div class="rep-meta">${labels[period]} · 统计区间：${rng.label} · 生成于 ${todayStr()}</div>
      <div class="rep-kpi">${kpiHtml}</div>
      <div class="rep-sec"><h3><span class="dot"></span>完成事项（${doneTasks.length}）</h3>${doneList}</div>
      <div class="rep-sec"><h3><span class="dot"></span>逾期 / 待跟进（${overdueTasks.length}）</h3>${overdueList}</div>
      <div class="rep-sec"><h3><span class="dot"></span>会议（${periodMeetings.length}）</h3>${meetList}</div>
      <div class="rep-sec"><h3><span class="dot"></span>项目进展（${progUpdates.length}）</h3>${progList}</div>
      <div class="rep-sec"><h3><span class="dot"></span>突发事项（${flashList.length}）</h3>${listHtml(flashList, x=>`<li>${esc(x.title)}${x.tags?(' · '+esc(x.tags)):''}${x.regTime?(' ｜ 登记 '+esc(x.regTime)):''}</li>`)}</div>
      <div class="rep-sec"><h3><span class="dot"></span>一句话复盘</h3><div class="rep-narr">${esc(narr)}</div></div>
    </div>`;
    document.getElementById("view-summary").innerHTML = html;
    document.querySelectorAll("#view-summary .seg button[data-rep]").forEach(b=>b.onclick=()=>{ repPeriod=b.getAttribute("data-rep"); renderSummary(); });
    const pdf=document.getElementById("rep-pdf"); if(pdf) pdf.onclick=()=>{ window.print(); };
  }
